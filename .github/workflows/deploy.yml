name: Deploy Laravel to AWS

on:
  workflow_dispatch: 
    inputs:
      environment:
        description: 'The environment to deploy to (e.g., production, staging)'
        required: true
        default: 'production'
      deploy_ami:
        description: 'Create a new AMI before deploying? (yes/no)'
        required: false
        default: 'yes'

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      STACK_NAME: recipehub-stack
      REGION: us-east-2

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Create New AMI and Update CloudFormation
        run: |
          INSTANCE_ID="i-0c1a09c9025af84fc"
          AMI_NAME="AMI-Updated-$(date +'%Y-%m-%d-%H-%M-%S')"
          echo "Creating a new AMI from instance: $INSTANCE_ID"
          NEW_AMI_ID=$(aws ec2 create-image --instance-id $INSTANCE_ID --name "$AMI_NAME" --no-reboot --output text)
          echo "New AMI ID: $NEW_AMI_ID"
          echo "Waiting for the AMI to become available..."
          aws ec2 wait image-available --image-ids $NEW_AMI_ID
          echo "AMI $NEW_AMI_ID is now available."
          OLD_AMI_ID=$(aws ec2 describe-instances --instance-id $INSTANCE_ID --query "Reservations[0].Instances[0].ImageId" --output text)
          echo "Updating CloudFormation template with new AMI ID: $NEW_AMI_ID"
          sed -i "s/ami-0123456789abcdef0/$NEW_AMI_ID/" template.yaml
          echo "Deleting the old AMI: $OLD_AMI_ID"
          if aws ec2 describe-images --image-ids "$OLD_AMI_ID" >/dev/null 2>&1; then
          aws ec2 deregister-image --image-id "$OLD_AMI_ID"
          echo "Deregistered old AMI: $OLD_AMI_ID"
          SNAPSHOT_IDS=$(aws ec2 describe-images --image-ids "$OLD_AMI_ID" --query 'Images[].BlockDeviceMappings[].Ebs.SnapshotId' --output text)
          for SNAPSHOT_ID in $SNAPSHOT_IDS; do
          if [ "$SNAPSHOT_ID" != "None" ]; then
          echo "Deleting snapshot: $SNAPSHOT_ID"
          aws ec2 delete-snapshot --snapshot-id "$SNAPSHOT_ID"
          fi
          done
          else
          echo "Old AMI $OLD_AMI_ID does not exist. Skipping delete."
          fi
          echo "AMI creation, CloudFormation update, and cleanup complete."

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name $STACK_NAME \
            --capabilities CAPABILITY_NAMED_IAM

      - name: Wait for EC2s to initialize
        run: sleep 60

      - name: Deployed Laravel
        run: |
          echo "Application deployed, ready for traffic"
